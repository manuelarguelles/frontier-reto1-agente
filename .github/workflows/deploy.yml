name: Deploy
# CD: tras CI en verde sobre main, despliega a Railway con `railway up` (token de cuenta como secreto)
# y verifica que el entrypoint público responde /health. Independiente de qué cuenta de GitHub use Railway.
on:
  workflow_run: { workflows: [CI], types: [completed], branches: [main] }
  workflow_dispatch:
concurrency: { group: deploy, cancel-in-progress: false }
jobs:
  deploy:
    # DEPLOY_FREEZE=1 (variable del repo) congela el CD automático, p. ej. durante una corrida de evaluación; el despliegue manual (workflow_dispatch) siempre pasa
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && vars.DEPLOY_FREEZE != '1')
    runs-on: ubuntu-latest
    env:
      RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ github.event.workflow_run.head_sha || github.sha }}" }
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - name: Instalar Railway CLI
        run: npm i -g @railway/cli
      - name: Desplegar
        run: railway up --project b0358c1e-2bf6-4fb5-8b3b-0fe0c0b61831 --environment production --service bountiful-perception --ci
      - name: Verificar entrypoint público
        env:
          AGENT_URL: ${{ secrets.AGENT_URL }}
          AGENT_TOKEN: ${{ secrets.AGENT_TOKEN }}
        run: |
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $AGENT_TOKEN" "$AGENT_URL/health" || true)
            [ "$code" = 200 ] && { echo "entrypoint OK"; exit 0; }
            sleep 10
          done
          echo "entrypoint no respondió 200"; exit 1
