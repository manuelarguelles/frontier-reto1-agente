name: Deploy check
# CD: Railway despliega solo desde main (integración con GitHub). Este job espera el despliegue y verifica el entrypoint público.
on:
  workflow_run: { workflows: [CI], types: [completed], branches: [main] }
  workflow_dispatch:
jobs:
  smoke:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Esperar despliegue y probar /health
        env:
          AGENT_URL: ${{ secrets.AGENT_URL }}
          AGENT_TOKEN: ${{ secrets.AGENT_TOKEN }}
        run: |
          [ -n "$AGENT_URL" ] || { echo "AGENT_URL no configurado; se omite"; exit 0; }
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $AGENT_TOKEN" "$AGENT_URL/health" || true)
            [ "$code" = 200 ] && { echo "entrypoint OK"; exit 0; }
            sleep 10
          done
          echo "entrypoint no respondió 200"; exit 1
